<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Dashboard สินเชื่อ</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #f4f6f9; }
  h1 { color: #2c3e50; }
  .cards { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 25px; }
  .card {
    flex: 1; min-width: 220px; background: white; border-radius: 10px;
    padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border-left: 6px solid #3498db;
  }
  .card.warning { border-left-color: #f39c12; }
  .card.danger { border-left-color: #e74c3c; }
  .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #7f8c8d; }
  .card .value { font-size: 28px; font-weight: bold; color: #2c3e50; }
  .card .sub { font-size: 13px; color: #95a5a6; margin-top: 5px; }

  table { border-collapse: collapse; width: 100%; background: white; }
  th, td { border: 1px solid #eee; padding: 8px 12px; font-size: 13px; text-align: left; }
  th { background: #34495e; color: white; position: sticky; top: 0; }
  tr.near-due { background: #fff3cd; }
  tr.overdue { background: #f8d7da; }
  .table-wrap { max-height: 500px; overflow-y: auto; margin-top: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

  .filters button {
    padding: 8px 16px; margin-right: 10px; border: none; border-radius: 6px;
    cursor: pointer; background: #ecf0f1; font-size: 13px;
  }
  .filters button.active { background: #3498db; color: white; }
  #status { font-weight: bold; margin-bottom: 15px; }
  .error { color: red; }
</style>
</head>
<body>

<h1>📊 Dashboard สินเชื่อ</h1>
<p id="status">กำลังโหลดข้อมูล...</p>

<div class="cards" id="cards"></div>

<div class="filters">
  <button class="active" data-filter="all">ทั้งหมด</button>
  <button data-filter="near">⏰ ใกล้ครบกำหนด (≤1 เดือน)</button>
  <button data-filter="overdue">🚨 เกินกำหนดแล้ว</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>ACC</th><th>ชื่อ</th><th>วันเริ่ม</th><th>วันครบกำหนด ▲</th>
        <th>ยอดคงเหลือ</th><th>เดือนที่เหลือ</th><th>สถานะ</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
const fileUrl = "https://raw.githubusercontent.com/aklaytae/data-portal/main/backend/limit.xlsx";
let allRows = [];

// เกณฑ์ "ใกล้ครบกำหนด" (หน่วย: เดือน) — ปรับได้ตรงนี้
const NEAR_DUE_MONTHS = 1;

function parseThaiName(nameStr) {
  const dateRegex = /(\d{1,2}\/\d{1,2}\/\d{4})/g;
  const matches = [...nameStr.matchAll(dateRegex)];
  let name = nameStr, startDate = null, endDate = null;
  if (matches.length >= 2) {
    startDate = matches[0][1];
    endDate = matches[1][1];
    name = nameStr.substring(0, matches[0].index).trim();
  }
  return { name, startDate, endDate };
}

function toDate(dmy) {
  if (!dmy) return null;
  const [d, m, y] = dmy.split("/").map(Number);
  return new Date(y, m - 1, d);
}

function monthsDiff(from, to) {
  return (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
}

async function loadExcel() {
  const statusEl = document.getElementById("status");
  try {
    const response = await fetch(fileUrl);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const arrayBuffer = await response.arrayBuffer();
    const workbook = XLSX.read(arrayBuffer, { type: "array" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const jsonData = XLSX.utils.sheet_to_json(sheet, { defval: "" });

    const today = new Date();

    allRows = jsonData.map(row => {
      const parsed = parseThaiName(String(row["NAME"] || ""));
      const dueDate = toDate(parsed.endDate);
      const balance = parseFloat(row["ALLBALANCE"]) || 0;
      let monthsLeft = null, status = "unknown";

      if (dueDate) {
        monthsLeft = monthsDiff(today, dueDate);
        if (monthsLeft < 0) status = "overdue";
        else if (monthsLeft <= NEAR_DUE_MONTHS) status = "near";
        else status = "ok";
      }

      return {
        acc: row["ACC"], name: parsed.name,
        startDate: parsed.startDate, endDate: parsed.endDate,
        dueDateObj: dueDate,
        balance, monthsLeft, status
      };
    });

    // 🔽 เรียงลำดับตามวันครบกำหนดสัญญา (ใกล้ที่สุดขึ้นก่อน)
    allRows.sort((a, b) => {
      if (!a.dueDateObj) return 1;   // ไม่มีวันที่ -> ไปท้ายสุด
      if (!b.dueDateObj) return -1;
      return a.dueDateObj - b.dueDateObj;
    });

    statusEl.textContent = `✅ โหลดข้อมูลสำเร็จ (${allRows.length} รายการ)`;
    renderCards();
    renderTable("all");
    setupFilters();

  } catch (err) {
    statusEl.textContent = "❌ โหลดข้อมูลไม่สำเร็จ: " + err.message;
    statusEl.className = "error";
    console.error(err);
  }
}

function renderCards() {
  const total = allRows.length;
  const totalBalance = allRows.reduce((s, r) => s + r.balance, 0);
  const nearRows = allRows.filter(r => r.status === "near");
  const overdueRows = allRows.filter(r => r.status === "overdue");

  document.getElementById("cards").innerHTML = `
    <div class="card">
      <h3>💰 สินเชื่อทั้งหมด</h3>
      <div class="value">${total.toLocaleString()} บัญชี</div>
      <div class="sub">ยอดรวม: ${totalBalance.toLocaleString(undefined,{minimumFractionDigits:2})} บาท</div>
    </div>
    <div class="card warning">
      <h3>⏰ ใกล้ครบกำหนด (≤ ${NEAR_DUE_MONTHS} เดือน)</h3>
      <div class="value">${nearRows.length.toLocaleString()} บัญชี</div>
      <div class="sub">ยอดรวม: ${nearRows.reduce((s,r)=>s+r.balance,0).toLocaleString(undefined,{minimumFractionDigits:2})} บาท</div>
    </div>
    <div class="card danger">
      <h3>🚨 เกินกำหนดแล้ว</h3>
      <div class="value">${overdueRows.length.toLocaleString()} บัญชี</div>
      <div class="sub">ยอดรวม: ${overdueRows.reduce((s,r)=>s+r.balance,0).toLocaleString(undefined,{minimumFractionDigits:2})} บาท</div>
    </div>
  `;
}

function renderTable(filter) {
  const tbody = document.getElementById("tableBody");
  let rows = allRows;
  if (filter === "near") rows = allRows.filter(r => r.status === "near");
  if (filter === "overdue") rows = allRows.filter(r => r.status === "overdue");

  tbody.innerHTML = rows.map(r => {
    const rowClass = r.status === "near" ? "near-due" : (r.status === "overdue" ? "overdue" : "");
    const statusLabel = r.status === "near" ? "⏰ ใกล้ครบกำหนด" :
                         r.status === "overdue" ? "🚨 เกินกำหนด" :
                         r.status === "ok" ? "✅ ปกติ" : "-";
    return `<tr class="${rowClass}">
      <td>${r.acc}</td><td>${r.name}</td>
      <td>${r.startDate || "-"}</td><td>${r.endDate || "-"}</td>
      <td>${r.balance.toLocaleString(undefined,{minimumFractionDigits:2})}</td>
      <td>${r.monthsLeft !== null ? r.monthsLeft : "-"}</td>
      <td>${statusLabel}</td>
    </tr>`;
  }).join("");
}

function setupFilters() {
  document.querySelectorAll(".filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderTable(btn.dataset.filter);
    });
  });
}

loadExcel();
</script>
</body>
</html>
